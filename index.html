<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Satu Plastik, Sejuta Kasih</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap"
    />
    <!-- logo -->
    <link rel="icon"  type="image/png" href="logo.png">

    <!-- og -->
    <meta property="og:title" content="EcoExperiment — Small Action, Real Impact">
    <meta property="og:description"
        content="Majalah lingkungan digital yang membahas kepedulian sampah plastik, solusi ramah lingkungan, dan aksi nyata kecil demi dampak besar bagi bumi.">
    <meta property="og:image" content="https://weill8.github.io/majalah_KP/og.png">
    <meta property="og:url" content="https://weill8.github.io/majalah_KP">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EcoExperiment">
    <meta property="og:locale" content="id_ID">

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="sp" role="dialog" aria-label="Pembuka / Intro">
      <h2 class="t">
        Satu Plastik, Sejuta Kasih<small
          >One Piece of Plastic, a Million Acts of Love</small
        >
      </h2>
      <p class="t">
        Satu tindakan kecil bisa mengubah dunia.<br />One small act can change
        the world.
      </p>
      <svg viewBox="0 0 200 260" aria-hidden="true">
        <ellipse cx="100" cy="246" rx="50" ry="7" fill="#0003" />
        <path
          class="stem"
          pathLength="1"
          d="M100 104V30"
          fill="none"
          stroke="#3fae6e"
          stroke-width="5"
          stroke-linecap="round"
        />
        <path
          class="lf l1"
          d="M100 55c-24 0-36-14-36-30 20-2 36 8 36 30z"
          fill="#4fc27e"
        />
        <path
          class="lf l2"
          d="M100 42c24 0 36-14 36-30-20-2-36 8-36 30z"
          fill="#4fc27e"
        />
        <path
          d="M80 110h40l14 30v92a10 10 0 0 1-10 10H76a10 10 0 0 1-10-10v-92z"
          fill="#9fe3ff"
          stroke="#3a9bb0"
          stroke-width="4"
          stroke-linejoin="round"
        />
        <rect
          x="86"
          y="96"
          width="28"
          height="16"
          rx="4"
          fill="#9fe3ff"
          stroke="#3a9bb0"
          stroke-width="4"
        />
        <rect
          x="82"
          y="90"
          width="36"
          height="8"
          rx="4"
          fill="#7fd0ee"
          stroke="#3a9bb0"
          stroke-width="3"
        />
        <path
          d="M78 150v70"
          stroke="#fff"
          stroke-width="5"
          stroke-linecap="round"
          opacity=".6"
        />
        <circle cx="90" cy="180" r="5" fill="#0f3b45" />
        <circle cx="110" cy="180" r="5" fill="#0f3b45" />
        <ellipse cx="80" cy="192" rx="6" ry="4" fill="#ff7a6b" opacity=".5" />
        <ellipse cx="120" cy="192" rx="6" ry="4" fill="#ff7a6b" opacity=".5" />
        <path
          d="M92 194q8 8 16 0"
          fill="none"
          stroke="#0f3b45"
          stroke-width="3"
          stroke-linecap="round"
        />
      </svg>
      <button id="sb">Mulai · Start</button>
    </div>
    <header>
      <b>♻️ EcoExperiment</b
      ><button id="lg" aria-label="Change language">EN</button>
    </header>
    <main><div id="tr"></div></main>
    <nav>
      <button id="pv" aria-label="Sebelumnya / Previous">‹</button>
      <div id="dots"></div>
      <span id="ct"></span
      ><button id="nx" aria-label="Berikutnya / Next">›</button>
    </nav>
    <div id="chat" hidden role="dialog" aria-modal="true" aria-label="Chat">
      <div class="cb-hd">
        <button id="cx" aria-label="Kembali / Back">‹</button>
        <div>
          <b>♻️ EcoExperiment</b><small>Asisten AI · AI assistant</small>
        </div>
      </div>
      <div id="msgs" aria-live="polite"></div>
      <form id="cf">
        <input id="ci" autocomplete="off" maxlength="300" />
        <button id="cs" aria-label="Kirim / Send">➤</button>
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
